{{- $tags := .Language.Params.Taxonomies.tag | default "tags" -}}
{{- $tagTerms := .GetTerms $tags -}}
{{- if gt (len $tagTerms) 0 -}}
<div class="brand-post-footer-meta">
  {{- if gt (len $tagTerms) 0 -}}
  <ul class="post-tags">
    {{- range $tagTerms -}}
    <li><a href="{{ .Permalink }}">{{ .LinkTitle }}</a></li>
    {{- end -}}
  </ul>
  {{- end -}}
</div>
{{- end -}}
