{{- $title := site.Title -}}
{{- $content := site.Params.description -}}
{{- with site.Params.homeHero -}}
  {{- $title = .title | default $title -}}
  {{- $content = .content | default $content -}}
{{- end -}}
<div class="brand-home-hero brand-editorial-hero">
  <h1 class="brand-page-title">{{ $title }}</h1>
  {{- with $content -}}
  <div class="brand-home-summary brand-editorial-summary">
    {{ . | markdownify }}
  </div>
  {{- end -}}
</div>
