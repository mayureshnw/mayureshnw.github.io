{{- $title := site.Title -}}
{{- $content := site.Params.description -}}
{{- with site.Params.homeInfoParams -}}
  {{- $title = .Title | default $title -}}
  {{- $content = .Content | default $content -}}
{{- end -}}
<div class="brand-home-hero">
  <h1>{{ $title }}</h1>
  {{- with $content -}}
  <div class="brand-home-summary">
    {{ . | markdownify }}
  </div>
  {{- end -}}
</div>
